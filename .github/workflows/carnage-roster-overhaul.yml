name: Apply Carnage roster overhaul

on:
  push:
    branches:
      - claude/carnage-roster-progression
    paths:
      - scripts/apply_carnage_roster_overhaul.py
      - .github/workflows/carnage-roster-overhaul.yml
  pull_request:
    branches:
      - claude/gow-game-development-hjs2e0
    paths:
      - scripts/apply_carnage_roster_overhaul.py
      - .github/workflows/carnage-roster-overhaul.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: claude/carnage-roster-progression
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply source migration
        run: python scripts/apply_carnage_roster_overhaul.py apply

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, validate Carnage, and build
        run: npm run check

      - name: Verify clean patch
        run: git diff --check

      - name: Remove migration bootstrap
        run: python scripts/apply_carnage_roster_overhaul.py cleanup

      - name: Commit verified overhaul
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(carnage): implement persistent roster progression"
          git push origin HEAD:claude/carnage-roster-progression
