name: Apply Carnage visual overhaul

on:
  push:
    branches:
      - claude/carnage-roster-progression
    paths:
      - scripts/apply_carnage_visual_overhaul_v2.py
      - .github/workflows/apply-carnage-visual-overhaul.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: claude/carnage-roster-progression
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply procedural visual migration
        run: python scripts/apply_carnage_visual_overhaul_v2.py

      - name: Install dependencies
        run: npm ci

      - name: Validate, typecheck and build
        run: npm run check

      - name: Verify patch formatting
        run: git diff --check

      - name: Commit verified visual overhaul
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/types.ts src/data/factions.ts src/data/morphs.ts src/gfx/unitArt.ts src/gfx/carnageVisualVariants.ts scripts/render-carnage.mjs scripts/validate-carnage-visuals.mjs package.json
          git commit -m "feat(carnage): implement distinct procedural unit designs"
          git push origin HEAD:claude/carnage-roster-progression

      # This workflow is intentionally retriggered after the roster work so the
      # visual implementation is committed before any showcase is rendered.
