<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0c10" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Grimdark" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <title>Grimdark Tabletop — Wargame Simulator</title>
    <!-- Grimdark gothic-industrial type: blackletter title, military stencil
         for labels/buttons, legible condensed + body faces for dense stats/log.
         Graceful system fallbacks if Google Fonts is blocked. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Black+Ops+One&family=Stardos+Stencil:wght@400;700&family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #07080a; font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; color: #e6dcc3; }
      #app { width: 100vw; height: 100vh; position: relative; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <!-- Gothic loading splash (driven by src/ui/Menu.ts). Self-contained; hidden by default. -->
    <div id="loading-splash" class="loading-splash" aria-hidden="true">
      <div class="ls-sigil"><span></span><span></span><span></span></div>
      <div class="ls-text">Summoning the war machine…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
